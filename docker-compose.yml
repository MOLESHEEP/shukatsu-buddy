# One-command deploy:   cp .env.example .env  &&  docker compose up -d
# With automatic HTTPS: docker compose --profile https up -d   (set DOMAIN in .env)

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shukatsu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: shukatsu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shukatsu -d shukatsu"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: ${APP_IMAGE:-shukatsu-buddy:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://shukatsu:${POSTGRES_PASSWORD}@db:5432/shukatsu
    ports:
      - "${APP_PORT:-3000}:3000"
    # Lets OLLAMA_BASE_URL / CUSTOM_BASE_URL reach services on the host via host.docker.internal (Linux too).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # Optional reverse proxy with automatic Let's Encrypt certificates.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
