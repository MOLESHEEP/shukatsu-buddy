# One-command deploy:   cp .env.example .env  &&  docker compose up -d
# Cloudflare Tunnel (recommended, free HTTPS, no open ports): docker compose --profile tunnel up -d   (set TUNNEL_TOKEN)
# Caddy + Let's Encrypt (opens 80/443):                       docker compose --profile https up -d    (set DOMAIN)
# Server without building: set APP_IMAGE=ghcr.io/molesheep/shukatsu-buddy:latest, then `pull` and `up -d --no-build`.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shukatsu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: shukatsu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shukatsu -d shukatsu"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: ${APP_IMAGE:-shukatsu-buddy:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://shukatsu:${POSTGRES_PASSWORD}@db:5432/shukatsu
    ports:
      # APP_BIND=127.0.0.1 keeps the app off the public internet (use with Cloudflare Tunnel or a local reverse proxy).
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    # Lets OLLAMA_BASE_URL / CUSTOM_BASE_URL reach services on the host via host.docker.internal (Linux too).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # Optional: Cloudflare Tunnel. Outbound-only connection to Cloudflare; HTTPS, CDN and DDoS protection for free.
  # In the Cloudflare dashboard, point the tunnel's public hostname to http://app:3000.
  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app

  # Optional reverse proxy with automatic Let's Encrypt certificates.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
